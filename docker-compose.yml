version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

  backend-1:
    build:
      context: ./server
      dockerfile: Dockerfile.hardened
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
      - INSTANCE_ID=backend-1
    expose:
      - "5000"
    restart: unless-stopped

  backend-2:
    build:
      context: ./server
      dockerfile: Dockerfile.hardened
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
      - INSTANCE_ID=backend-2
    expose:
      - "5000"
    restart: unless-stopped

  backend-3:
    build:
      context: ./server
      dockerfile: Dockerfile.hardened
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123}
      - INSTANCE_ID=backend-3
    expose:
      - "5000"
    restart: unless-stopped
